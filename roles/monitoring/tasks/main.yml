---
- name: Create prometheus user
  ansible.builtin.user:
    name: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download Prometheus {{ prometheus_version }}
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-arm64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"

- name: Extract Prometheus
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp/
    remote_src: true

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-arm64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  notify: Restart prometheus

- name: Deploy prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    mode: "0644"
  notify: Restart prometheus

- name: Deploy prometheus systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus
      After=network.target

      [Service]
      Type=simple
      User=prometheus
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus \
        --storage.tsdb.retention.time=30d
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify: Restart prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

- name: Install Grafana dependencies
  ansible.builtin.apt:
    name:
      - adduser
      - libfontconfig1
    state: present

- name: Download Grafana {{ grafana_version }}
  ansible.builtin.get_url:
    url: "https://dl.grafana.com/oss/release/grafana_{{ grafana_version }}_arm64.deb"
    dest: "/tmp/grafana_{{ grafana_version }}_arm64.deb"
    mode: "0644"

- name: Install Grafana
  ansible.builtin.apt:
    deb: "/tmp/grafana_{{ grafana_version }}_arm64.deb"
    state: present
  notify: Restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true

handlers:
  - name: Restart prometheus
    ansible.builtin.systemd:
      name: prometheus
      state: restarted
      daemon_reload: true

  - name: Restart grafana
    ansible.builtin.systemd:
      name: grafana-server
      state: restarted
